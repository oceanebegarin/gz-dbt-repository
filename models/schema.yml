version: 2
sources:
  - name: raw
    schema: gz_raw_data
    description: "Données brutes issues du système e-commerce Greenweez"
    tables:

      - name: sales
        identifier: raw_gz_sales
        description: "Sales of Greenweez / one row per product_id found in each orders_id"
        columns:
          - name: date_date
            description: "Date of purchase"
          - name: orders_id
            description: "Unique ID of each order"
          - name: products_id
            description: "Unique ID of each product in the order"
          - name: turnover
            description: "Turnover generated by the sale"
          - name: quantity
            description: "Number of products sold in this order"
        tests:
        - unique : 
            column_name: "CONCAT(orders_id,pdt_id)"
        - not_null :
            column_name: "CONCAT(orders_id,pdt_id)"


      - name: products
        identifier: raw_gz_product
        description: "Product catalog with prices and categories"
        columns:
          - name: products_id
            description: "Unique product identifier"
            tests: 
              - not_null 
              - unique
          - name: purchase_cost
            description: "Purchase cost of the product for Greenweez"
          - name: category
            description: "Product category (food, cosmetics, etc.)"


      - name: ship
        identifier: raw_gz_ship
        description: "Shipping cost data linked to each order"
        columns:
          - name: orders_id
            description: "Order ID (foreign key)"
            tests: 
              - not_null 
              - unique
          - name: shipping_fee
            description: "Customer-paid shipping fee"
          - name: logcost
            description: "Logistics cost"
          - name: ship_cost
            description: "Real cost of shipping"
        

